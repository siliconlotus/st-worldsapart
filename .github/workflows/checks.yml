name: checks
on:
  pull_request:
  push:
    branches: [staging, release]

# A newer push to the same PR supersedes the run in flight.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  WA: sillytavern/public/scripts/extensions/third-party/st-worldsapart

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: wa
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # A real SillyTavern at the manifest's minimum_client_version: the plugin checks import its server's src/, and
      # acorn (undeclared-check) and tiktoken (tokens-check) resolve out of its node_modules.
      - name: install SillyTavern and place the checkout at its install depth
        run: |
          ST_VERSION=$(node -p 'require("./wa/manifest.json").minimum_client_version')
          git clone --quiet --depth 1 --branch "$ST_VERSION" https://github.com/SillyTavern/SillyTavern.git sillytavern
          cp sillytavern/default/config.yaml sillytavern/config.yaml
          (cd sillytavern && npm ci --no-audit --no-fund --silent)
          mv wa "$WA"
      # eval-data/ is gitignored, so a fresh checkout has none; grade-pending-check and paired-check write scratch files there.
      - name: scratch directory the harness writes into
        run: mkdir -p "$WA/eval/eval-data"
      # eq() sets process.exitCode, so a failed assertion and a thrown error are the same signal;
      # the whole log is printed for a failure, because grepping for ^FAIL misses throws.
      - name: regression suite
        working-directory: sillytavern/public/scripts/extensions/third-party/st-worldsapart
        run: |
          fail=0
          for f in test/*-check.mjs; do
            if out=$(node "$f" 2>&1); then
              echo "ok   $f"
            else
              echo "::error file=$f::$f failed"
              echo "$out"
              fail=1
            fi
          done
          exit $fail
